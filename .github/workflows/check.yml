name: Configuration checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # Pi-extension regression tests use
          # node:module.stripTypeScriptTypes, which requires Node >= 22.13.
          node-version: "22"
      - name: Install verification tools
        run: |
          brew install emacs fish jq neovim shellcheck tmux
          version=$(awk '/^PYRIGHT_VERSION :=/ { print $3 }' Makefile)
          npm install --global "pyright@$version"
      - name: Verify without editor packages or deployment
        run: make verify
